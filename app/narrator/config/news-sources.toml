# Источники дайджеста новостей (narrate news collect). Подборка и логика
# важности — docs/news/sources-v1.md и sources-v2.md, устройство — спек
# 2026-09-23-news-digest.
#
# Поля источника:
#   id        — латиницей, уникальный; им помечены материалы в news.db
#   name, url — как называть и куда вести человека
#   type      — место в иерархии доверия (веса — [types] ниже)
#   authority — свой вес доверия вместо веса типа (необязательно)
#   category  — тема: stack, backend, ai, youtube_en, youtube_ru, telegram, radar
#   priority  — 1…5 из подборки, для порядка в выдаче агенту
#   kind      — как забирать:
#     feed     — RSS/Atom по адресу feed
#     page     — ищем ленту на странице url, иначе ссылки с путём match
#     github   — релизы repo (tags = true — теги), exclude — отсеять rc/beta
#     godl     — стабильные версии Go с go.dev/dl
#     youtube  — лента канала handle
#     telegram — публичный канал channel через t.me/s
#     govuln   — Go Vulnerability Database (vuln.go.dev), только проверенные
#     ghsa     — GitHub Advisory Database по ecosystem, не ниже min_severity
#   vendor    — чьи это новости, для правила «не больше двух событий
#               поставщика в главном»; по умолчанию id до первого «_»
#   enabled   — false выключает источник, причина — в note

[types]
official = 1.00
official_changelog = 1.00
engineering_blog = 0.90
expert_blog = 0.85
conference = 0.80
youtube_expert = 0.75
telegram_channel = 0.65
telegram_community = 0.55
newsletter = 0.55
aggregator = 0.45

# Вторичные источники: без confirmed_by важность не выше 6 (правило §9).
[confirm]
secondary = [
  "conference", "youtube_expert", "telegram_channel", "telegram_community",
  "newsletter", "aggregator",
]

