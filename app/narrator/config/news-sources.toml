[[source]]
id = "ghsa_go"
vendor = "ghsa"
name = "GitHub Advisories: Go"
url = "https://github.com/advisories?query=ecosystem%3Ago"
type = "official"
category = "stack"
priority = 5
kind = "ghsa"
ecosystem = "go"
min_severity = "medium"
# Без списка в экосистеме Go — сплошь уязвимости конечных приложений: десятки в
# день. Здесь — библиотеки, которые стоят в типичном Go/backend-сервисе.
packages = [
  "golang.org/x/net",
  "golang.org/x/crypto",
  "golang.org/x/oauth2",
  "golang.org/x/text",
  "golang.org/x/sys",
  "golang.org/x/image",
  "google.golang.org/grpc",
  "google.golang.org/protobuf",
  "github.com/grpc-ecosystem/grpc-gateway/v2",
  "github.com/jackc/pgx/v5",
  "github.com/jackc/pgx/v4",
  "github.com/lib/pq",
  "github.com/redis/go-redis/v9",
  "github.com/IBM/sarama",
  "github.com/segmentio/kafka-go",
  "github.com/twmb/franz-go",
  "github.com/ClickHouse/clickhouse-go/v2",
  "github.com/rabbitmq/amqp091-go",
  "github.com/nats-io/nats-server/v2",
  "go.mongodb.org/mongo-driver",
  "go.etcd.io/etcd/server/v3",
  "github.com/gin-gonic/gin",
  "github.com/labstack/echo/v4",
  "github.com/gofiber/fiber/v2",
  "github.com/go-chi/chi/v5",
  "github.com/gorilla/websocket",
  "github.com/gorilla/mux",
  "github.com/golang-jwt/jwt/v5",
  "github.com/golang-jwt/jwt/v4",
  "github.com/quic-go/quic-go",
