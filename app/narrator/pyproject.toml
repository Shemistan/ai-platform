[project]
name = "narrator"
version = "0.1.0"
description = "Офлайн-озвучка статей: адаптированный текст → Supertonic 3 → mp3 и реестр"
requires-python = ">=3.11,<3.13"
dependencies = [
    "supertonic==1.3.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "trafilatura>=2.0",
    "ruaccent>=1.5",
    # Сырой текст → текст для озвучки (narrator.normalize): числа словами и
    # произношение английских слов (CMUdict; пакет-обёртка под GPL-3).
    "num2words>=0.5.14",
    "cmudict>=1.1",
    # Обложка и видео дайджеста (narrator.news.cover, narrator.news.video). Раньше
    # приезжал транзитивно с экстрами — без них (CI) падал импорт (QA-028).
    "pillow>=10",
]

[project.optional-dependencies]
# Движок ESpeech-TTS-1 (F5-TTS); на Mac считает на видеокарте через MPS.
espeech = ["f5-tts>=1.1"]
# Проверка озвучки распознаванием (narrator verify): модель faster-whisper small.
verify = ["faster-whisper>=1.1"]

[project.scripts]
narrator = "narrator.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/narrator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
