<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сегодня — AI Platform</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="today">
    <header class="page-head today-head">
      <h1 id="greeting">Сегодня</h1>
    </header>

    <form class="today-input" id="input" novalidate>
      <label class="sr-only" for="what">Что делаем</label>
      <textarea id="what" rows="3" placeholder="Вставь ссылку на статью или текст — или перетащи сюда видео со своей записью"></textarea>
      <input type="file" id="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm" hidden>
      <div class="today-suggest">
        <p class="muted" id="suggest">Ссылка — видео по статье, короткий текст — пост, видео — монтаж.</p>
        <button type="button" class="btn btn--link" id="pick">Выбрать видео</button>
        <button type="submit" class="btn btn--primary" id="go" hidden></button>
      </div>
      <p class="form-error" id="error" role="alert" hidden></p>
    </form>

    <section class="today-block" aria-labelledby="waiting-title">
      <h2 id="waiting-title">Ждут тебя</h2>
      <div class="today-cards" id="waiting"><p class="muted">Загружаю…</p></div>
      <a class="btn btn--link" id="all" href="/board/">Все выпуски</a>
    </section>

    <section class="today-block" id="running-block" aria-labelledby="running-title" hidden>
      <h2 id="running-title">Идёт сейчас</h2>
      <ul class="today-running" id="running"></ul>
    </section>
  </main>

  <script src="/nav.js" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
