<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновления — AI Platform</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-head">
    <h1>Обновления</h1>
    <p class="muted">Новые версии моделей и пайплайнов и список организаций, которые надо помечать в видео.</p>
  </header>

  <main class="updates">
    <section class="panel">
      <div class="section-head">
        <h2>Модели и пайплайны</h2>
        <button type="button" class="secondary" id="models-check">Проверить обновления</button>
      </div>
      <p class="hint">Сверяет установленное с PyPI, GitHub, Hugging Face и git narrator. Сам ничего не ставит — подсказывает, как обновить.</p>
      <div id="models"></div>
    </section>

    <section class="panel">
      <div class="section-head">
        <h2>Запрещённые в РФ организации</h2>
        <button type="button" class="secondary" id="registry-check">Проверить обновления списка</button>
      </div>
      <p class="hint" id="registry-hint"></p>
      <div id="proposal"></div>
      <div id="registry"></div>
      <details class="editor">
        <summary class="link">Править список (JSON)</summary>
        <textarea id="registry-json" class="mono" rows="18" spellcheck="false"></textarea>
        <div class="actions">
          <button type="button" class="secondary" id="registry-save">Сохранить</button>
          <button type="button" class="link danger" id="registry-reset">Вернуть список по умолчанию</button>
        </div>
      </details>
      <p class="form-error" id="error" role="alert" hidden></p>
    </section>
  </main>

  <script src="/nav.js" type="module"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
