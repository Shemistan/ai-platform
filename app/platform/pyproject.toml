[project]
name = "aiplatform"
version = "0.1.0"
description = "Локальная AI-платформа: фото, видео, озвучка и сценарии (дайджест, видео по статье)"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Разметка и GSAP-таймлайны шаблонов: строки-шаблоны длиннее 120 знаков читаются целиком.
"aiplatform/montage/templates.py" = ["E501"]
