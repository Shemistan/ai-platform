# Независимая проверка: тот же ./check, что гоняет pre-commit, но на чистой машине.
# PR staging → main без зелёного статуса не сливать (required check — README, «CI»).
name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Apple Silicon — как у автора: setup-model.sh, MLX-проверки и ffmpeg те же.
    runs-on: macos-14
    timeout-minutes: 30
    env:
      # Экстры narrator с моделями (espeech → torch) тесты не импортируют: не ставим.
      NARRATOR_CHECK_EXTRAS: ""
      PYTHON: python3.12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/platform/pyproject.toml

      # node: node --check по static/*.js и юнит-тесты фронтенда (node --test tests/js/).
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: app/narrator/uv.lock

      # Формула ffmpeg в Homebrew — без freetype, а постер и слайды рисуются drawtext:
      # нужна ffmpeg-full (QA-028). Она keg-only — кладём её bin первой в PATH.
      - name: ffmpeg и линтеры
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
          python3.12 -m pip install ruff coverage

      # Студийные тесты без ffmpeg тихо пропускаются (skipUnless) — здесь его наличие обязательно,
      # и с drawtext: без него падают десятки тестов сборки с невнятным «Filter not found».
      - name: окружение
        run: |
          which ffmpeg
          ffmpeg -hide_banner -version | head -1
          ffmpeg -hide_banner -filters | grep -q ' drawtext ' || { echo "в ffmpeg нет drawtext" >&2; exit 1; }
          python3.12 --version
          uv --version
          ruff --version
          node --version

      - name: ./check
        run: ./check

      # Покрытие без порога (QA-022): итог — в лог джобы.
      - name: покрытие платформы
        if: success()
        run: make -C app/platform cov

      - name: покрытие narrator
        if: success()
        run: make -C app/narrator cov
